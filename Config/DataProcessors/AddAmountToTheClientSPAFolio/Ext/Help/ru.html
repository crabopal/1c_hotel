<h1><font color="#000080">Обработка "Начисление суммы на лицевой счет клиента в СПА"</font></h1>
<h3>Назначение</h3>Обработка используется при необходимости в отеле начислить произвольную сумму на лицевой счет клиента в 1С:СПА. Данные по оплате отправляются в СПА через вызов web-службы.</body></html>
