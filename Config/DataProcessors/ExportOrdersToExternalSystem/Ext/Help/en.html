<h1><font color="#000080">Обработка "Выгрузка заказов во внешнюю систему"</font></h1>
<h3>Назначение</h3>
<p>Обработка используется для выгрузки заказов во внешние системы. Например заказы вида "Заказ блюд из номера" может быть выгружен во внешнюю POS систему. Заказ вида "Трансфер" может быть выгружен в систему учета транспортного отдела и т.д.</p></body></html>
