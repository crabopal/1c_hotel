<h3>Назначение</h3>
<p>Драйвер системы электронных замков <font color="#000080">HOIST</font>. Позволяет кодировать новые ключи-карты, проверять данные на картах-ключах.</p>
<p class="Usual">Относится к подсистеме <a href="Subsystem.Settings/Help">"Управление настройками"</a>.</p>
<p></p>
<h3>Способ вызова</h3>
<p class="Usual">Системная обработка. Из меню не вызывается.</p></body></html>
