<h3>Назначение</h3>
<p>Обработка позволяет установить курсы валют на дату.</p>
<p class="Usual">Относится к подсистеме: <a href="Subsystem.Invoices/Help">«Управление взаиморасчетами»</a>.</p>
<p>
</p><h3>Способ вызова</h3>
<p class="Usual">Вызывается из формы списка справочника <a href="Catalog.Currencies/Help">"Валюты"</a></p></body></html>
