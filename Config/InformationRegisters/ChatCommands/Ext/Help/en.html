<h1><font color="#000080">Регистр сведений "Команды чат бота"</font></h1>
<h3>Назначение</h3>
<p>Регистр содержит информацию о том какой команде соответствует какое сообщение </p>
<p class="Usual">Относится к подсистеме: <font color="#0066cc">«Чат бот»</font>.</p>
<p></p>
<h3>Параметры</h3>
<p class="Usual">Периодичность: Непериодический.</p>
<p class="Usual">Режим записи: Независимый.</p>
<p></p>
<h3>Измерения</h3>
<ul><li><strong>Текст</strong>. Строка.</li></ul><h3>Ресурсы</h3>
<ul><li><strong>Команда</strong>. Строка.</li></ul></body></html>
