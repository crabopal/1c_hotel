<h3>Назначение</h3>
<p>Регистр содержит данные справочников УФМС России, которые используются при вводе паспортных данных клиентов. </p>
<p>Относится к подсистеме: <a href="Subsystem.FrontOffice/Help">«Управление номерным фондом»</a>.</p>
<p></p>
<h3>Параметры</h3>
<p class="Usual">Периодичность: Непериодический.</p>
<p class="Usual">Режим записи: Независимый.</p></body></html>
