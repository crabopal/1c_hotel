<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></meta><link rel="stylesheet" type="text/css" href="v8help://service_book/service_style"></link></head><body>Регистр хранит привязки между сотрудниками и их логинами в программу. При создании пользователя информационной базы UUID его логина прописывается в этот регистр с указанием сотрудника, чей логин был создан.</body></html>
