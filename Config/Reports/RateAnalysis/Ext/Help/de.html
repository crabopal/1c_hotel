<h3>Назначение</h3>
<p class="Usual">Имя отчета в конфигураторе «RateAnalysis». </p>
<p class="Usual">Отчет используется для формирования на дату списка проживающих гостей и по каждому гостю отображает сумму начислений разбитую по видам услуг: проживание, питание, налоги, и т.д.</p></body></html>
