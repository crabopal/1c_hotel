<p>Подсистема "Взаиморасчеты" объединяет объекты метаданных, которые имеют отношение к взаиморасчетам с гостями и контрагентами. В подсистему также включены объекты, которые имеют отношение к обмену данными с бухгалтерской системой и системой фронт офиса ресторана.</p></body></html>
